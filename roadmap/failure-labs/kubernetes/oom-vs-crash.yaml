---
apiVersion: v1
kind: Pod
metadata:
  name: alpha
  labels:
    lab: oom-vs-crash
spec:
  restartPolicy: Always
  containers:
  - name: alpha
    image: polinux/stress:1.0.4
    resources:
      limits:
        memory: "50Mi"
      requests:
        memory: "50Mi"
    command: ["stress"]
    args: ["--vm", "1", "--vm-bytes", "150M", "--vm-hang", "0"]
---
apiVersion: v1
kind: Pod
metadata:
  name: beta
  labels:
    lab: oom-vs-crash
spec:
  restartPolicy: Always
  containers:
  - name: beta
    image: alpine:3.19
    command: ["sh", "-c"]
    args:
      - |
        echo "starting up..."
        echo "checking required env var DB_URL..."
        if [ -z "$DB_URL" ]; then
          echo "FATAL: DB_URL not set, exiting"
          exit 1
        fi
        sleep 3600
---
apiVersion: v1
kind: Pod
metadata:
  name: gamma
  labels:
    lab: oom-vs-crash
spec:
  restartPolicy: Always
  containers:
  - name: gamma
    image: alpine:3.19
    resources:
      limits:
        memory: "128Mi"
      requests:
        memory: "128Mi"
    command: ["sh", "-c"]
    args:
      - |
        echo "gamma starting..."
        sleep 5
        echo "simulating a native crash"
        kill -s SEGV $$    # busybox ash needs -s SEGV or -11, not bash-style -SEGV
